# AgentShore model catalog — the curated baseline of known/selectable models
# per agent harness. For harnesses with a free CLI model probe (codex, grok,
# antigravity, swink_coding) this is only the OFFLINE FALLBACK: the live list
# is discovered at agent spawn (agents/model_resolver.py) and written through
# to the global override below. Top-level keys are agent_key strings matching AgentType
# values used throughout the CLI wizard and desktop Setup screen (claude_code,
# codex, grok, antigravity).
#
# HOW TO OVERRIDE (no code change, no rebuild):
#   1. Create the global touchpoint that overrides the bundled copy:
#        macOS:   ~/Library/Application Support/agentshore/models.yaml
#        Linux:   ~/.config/agentshore/models.yaml
#        Windows: %LOCALAPPDATA%\SuperSwinkAI\agentshore\models.yaml
#      (the exact path is agentshore.paths.GLOBAL_MODELS_PATH)
#   2. Each agent key's list is a WHOLESALE REPLACEMENT when present in the
#      override — list every model you want that harness to offer, not just
#      the ones you're adding. Keys omitted from the override keep the
#      bundled default untouched.
#   3. Every model listed here must have a matching entry under this
#      project's pricing.yaml `models:` table, or it silently bills at the
#      agent_defaults rate (see tests/test_model_catalog.py::
#      test_every_catalog_model_has_a_pricing_row, which enforces this for
#      the bundled catalog).

models:
  claude_code:
    # CLI aliases (resolved by the claude binary itself)
    - haiku
    - sonnet
    - opus
    - fable
    # Pinned model IDs — current generation (alias targets)
    - claude-haiku-5-5
    - claude-sonnet-5-5
    - claude-opus-5-5
    - claude-fable-5-1
    # Pinned model IDs — earlier generations
    - claude-haiku-4-5
    - claude-sonnet-4-5
    - claude-sonnet-4-6
    - claude-sonnet-5
    - claude-opus-4-5
    - claude-opus-4-6
    - claude-opus-4-7
    - claude-opus-4-8
    - claude-opus-5
    - claude-fable-5

  codex:
    # ChatGPT-account-compatible line (also works with API-key auth).
    # gpt-5.6-sol/terra/luna (released 2026-07-09) map directly onto
    # AgentShore's large/medium/small tiers - OpenAI's own
    # flagship/balanced/fast-affordable segmentation. Verified live via
    # codex-cli 0.144.1 `debug models`.
    - gpt-5.6-sol
    - gpt-5.6-terra
    - gpt-5.6-luna
    - gpt-5.5
    # gpt-5.4 / gpt-5.4-mini are deliberately absent: codex-cli 0.144.1 rejects
    # them under ChatGPT-account auth ("not supported when using Codex with a
    # ChatGPT account"), the same permanent-INVALID_MODEL risk as below.
    # gpt-5.5-pro is deliberately absent: it 400s under ChatGPT-account auth
    # (verified codex-cli 0.141.0), which would permanently kill the agent via
    # INVALID_MODEL; API-key users still get it from live fetch.
    # gpt-5.3-codex-spark is also absent: it's a Pro-tier-gated research
    # preview ("supported_in_api": false, verified codex-cli 0.144.1) with the
    # same non-eligible-account risk; live refresh will surface it for
    # accounts that do have access.
    # gpt-5.4-nano was retired by OpenAI - absent from codex-cli 0.144.1
    # `debug models` as of 2026-07-11; its pricing.yaml row is kept for any
    # existing user overrides still pointing at it.

  grok:
    # Offline fallback only — live list comes from `grok models` (grok 1.0.50).
    - grok-4.7
    - grok-4.7-build-fast
    - grok-4.6
    - grok-4.5

  antigravity:
    # agy exposes models by display name with reasoning effort baked in (no
    # separate effort flag). Offline fallback only — the live list comes from
    # `agy models` (mirrors agy 1.3.2).
    - Gemini 3.8 Flash (High)
    - Gemini 3.8 Flash (Medium)
    - Gemini 3.8 Flash (Low)
    - Gemini 3.1 Pro (High)
    - Gemini 3.1 Pro (Low)
    - Claude Opus 5.5 (High)
    - Claude Sonnet 5.5 (High)
    - GPT-OSS 120B (Medium)

  swink_coding:
    # swink-coding's `--model` flag only accepts these three literal tier
    # aliases; the CLI itself resolves each alias to a concrete model id from
    # its own local config (~/.swink-coding/config.toml), which can point at
    # local backends such as Ollama. This offline fallback is just the three
    # aliases, no pinned model IDs; the live list comes from
    # `swink-coding models --json` (agents/model_discovery.py), which keeps
    # these aliases selectable on top of the concrete models it reports.
    - small
    - medium
    - large

  copilot:
    # Offline fallback only — the live list comes from the Copilot API model
    # catalog (agents/model_discovery.py discover_copilot_models), filtered to
    # the models this account's seat may use. `auto` is always valid (the
    # account routes it, e.g. to mai-code-1.1-flash). Ids are deliberately
    # ones that don't collide with codex/claude_code pricing rows.
    - auto
    - claude-haiku-5.5
    - claude-sonnet-5.5
    - claude-opus-5.5
    - mai-code-1.1-flash
    - gemini-3.8-flash
    - kimi-k3
